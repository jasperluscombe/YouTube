# Channel config: one place to change the niche, voice, and format.
channel:
  name: "Year Zero"                # working name, rename freely
  niche: "2D-animated second-person apocalypse, survival & future stories (YouTube Shorts)"
  why: >
    First-person "what would life be like" videos (e.g. "you wake up as the last
    person on Earth in 2087") go viral because the viewer imagines living in that world.
    Survival dramas built around a well-stocked base (fortress vs. chaos) are
    trending too. We write every script in second person ("you").
  series:
    - "POV: Year ____"             # a normal day in a far future (2150, 2500, 3000...)
    - "Day __ of ____"             # survival log: day 1, day 40, day 300 of an apocalypse
    - "Last Human"                 # alone / first to wake / last one left
    - "What If ____"               # the sun goes out, oceans drain, AI takes over, etc.

format:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 180              # Shorts allow up to 3 minutes

# Our own voice: a weighted blend of Kokoro preset voices.
# Natural, energetic storyteller (not a slow trailer voice).
# Scenes can override pace with "speed" in the story JSON (e.g. 1.0 for a dramatic beat).
voice:
  lang_code: "a"                   # a = American English, b = British
  blend:
    am_michael: 0.55               # natural storyteller
    am_fenrir: 0.25                # weight and edge
    am_onyx: 0.20                  # depth for the dramatic beats
  speed: 0.95                      # unhurried; drama comes from pauses between beats (see voice.py)
  polish: true                     # EQ + compression + tiny room reverb so it sounds recorded, not synthetic

# Animated clips (fal.ai). Swap the model to change look/price; clips are cached.
video:
  model: "fal-ai/minimax/hailuo-02/standard/text-to-video"
  args:
    duration: "6"
    prompt_optimizer: true
